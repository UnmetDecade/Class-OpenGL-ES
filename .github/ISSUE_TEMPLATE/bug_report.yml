name: Bug report
description: Report a build, runtime or rendering problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the
        problem, especially any `GLCall` error output.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug and which example triggers it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
        2. cmake --build build -j
        3. ./build/09_shadow
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: Affected example or module
      placeholder: "09_shadow / ShadowMap"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux (X11)
        - Linux (Wayland)
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: "Apple M4 / macOS 15, or Mesa 24.0 llvmpipe"
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Toolchain
      placeholder: "CMake 4.4.5, Apple clang 21, GLFW 3.4"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any compiler output or `file:line call error code` lines.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this one.
          required: true
        - label: I reproduced this on a Debug build, where `GLCall` checks are active.
          required: true
