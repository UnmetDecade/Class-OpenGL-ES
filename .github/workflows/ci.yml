name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install GLFW/EGL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorg-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DENGINE_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON
          -DGLFW_BUILD_WAYLAND=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check documentation links
        run: python3 scripts/check_docs.py

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DENGINE_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON
          -DGLFW_BUILD_WAYLAND=OFF

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install GLFW/EGL build dependencies and gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorg-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev gcovr

      - name: Configure with coverage
        run: >
          cmake -S . -B build-cov
          -DCMAKE_BUILD_TYPE=Debug
          -DENGINE_ENABLE_COVERAGE=ON
          -DENGINE_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON
          -DGLFW_BUILD_WAYLAND=OFF

      - name: Build test targets
        run: cmake --build build-cov -j"$(nproc)" --target camera_tests obj_loader_tests

      - name: Run unit tests
        run: ctest --test-dir build-cov --output-on-failure

      - name: Collect coverage
        run: |
          gcovr --root . \
            --filter '.*engine/Renderer/(Camera|ObjLoader)\.cpp$' \
            --json build-cov/coverage.json
          python3 scripts/check_coverage.py build-cov/coverage.json

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
